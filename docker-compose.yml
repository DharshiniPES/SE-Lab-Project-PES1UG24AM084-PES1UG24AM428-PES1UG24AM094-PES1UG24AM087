version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dclrg-gateway:latest
    container_name: dclrg_gateway_service
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - FLASK_SECRET_KEY=production-secure-key-campus-gateway-2026
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
